# Keep pinned GitHub Actions up to date. Only the github-actions ecosystem is
# tracked: everything else in this repo is synced from upstream.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2  # only propose releases that are at least 48h old
    groups:
      github-actions:
        patterns: ['*']
    labels:
      - docs-not-required
      - release-note-not-required
